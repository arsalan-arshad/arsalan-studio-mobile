name: Create Production Builds

on:
  push:
    branches:
      - main

jobs:
  # EAS Workflow jobs run as Developer max — keep the `production` Update
  # channel unprotected or this job fails (Entity Not Authorized).
  publish_ota:
    name: Publish OTA (production)
    type: update
    params:
      channel: production
      message: Production OTA from main

  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
