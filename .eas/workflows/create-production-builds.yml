name: Create Production Builds

on:
  push:
    branches:
      - main

jobs:
  # EAS Workflow jobs run as Developer max — `production` channel must stay
  # unprotected or this job fails (Entity Not Authorized on protected channels).
  publish_ota:
    name: Publish OTA (production)
    type: update
    params:
      channel: production
      message: Production OTA from main

  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
